{% extends "crud/base.html" %}
{% block title %}Форма{% endblock %}
{% block content %}
<h1>{% if object %}Редактирование{% else %}Новая запись{% endif %}</h1>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Сохранить</button>
  <a class="btn" href="{% url 'crud:list' %}">Отмена</a>
</form>
{% endblock %}
